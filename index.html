<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሚቶ ወረዳ ፖሊስ ጽ/ቤት</title>
    <style>
        :root { --primary-color: #004a99; --bg-color: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); text-align: center; margin: 0; padding: 15px; }
        .container { background: white; width: 95%; max-width: 450px; margin: 10px auto; padding: 25px; border-radius: 15px; border-top: 10px solid var(--primary-color); box-shadow: 0px 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary-color); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        #mainFormSection { display: none; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="container" id="loginSection">
    <h2>ሚቶ ወረዳ ፖሊስ ጽ/ቤት</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus"></div>
</div>

<div class="container" id="mainFormSection">
    <h2>መንደር 4 ሮንድ ተረኞች</h2>
    <form id="patrolForm">
        <input type="text" name="fullname" placeholder="የተረኛ ስም" required>
        <input type="date" name="date" required title="የወጣበት ቀን">
        <input type="tel" name="phone" placeholder="ስልክ ቁጥር" required>
        <textarea name="remarks" placeholder="ልዩ የሚጻፍ ነገር ካለ..." rows="3"></textarea>
        <button type="submit" id="submitBtn">መረጃውን አስመዝግብ</button>
    </form>
    <div id="status" style="margin-top:15px; font-weight:bold;"></div>
    <button onclick="location.reload()" style="background:#dc3545; margin-top:20px;">ውጣ</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbznOzQvBtmODMqJce50Pyq_OiciTxWHJOcjZOzXut7ScOC0NFqIzq22Jd2gYaDO6caXMg/exec';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // ሎጊን ስክሪኑ እንዳይመለስ በ localStorage መጠቀም እንችላለን
        if (document.getElementById('username').value === "mito" && document.getElementById('password').value === "123") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainFormSection').style.display = "block";
        } else {
            document.getElementById('loginStatus').innerHTML = "<span class='error'>ስህተት!</span>";
        }
    });

    document.getElementById('patrolForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "በመላክ ላይ...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(this)})
            .then(() => {
                document.getElementById('status').innerHTML = "በተሳካ ሁኔታ ተመዝግቧል! ✅";
                this.reset();
                btn.disabled = false;
                btn.innerText = "መረጃውን አስመዝግብ";
            });
    });
</script>
</body>
</html>
