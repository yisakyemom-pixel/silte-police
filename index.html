<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #002244;
            --bg-color: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            background: white; 
            width: 95%; 
            max-width: 450px; 
            margin: 20px auto; 
            padding: 30px; 
            border-radius: 15px; 
            border-top: 10px solid var(--primary-color);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        } 

        .logo-container { margin-bottom: 15px; }
        .dept-logo { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            border-radius: 50%; 
            border: 3px solid var(--primary-color); 
            padding: 5px; 
        } 

        h2 { color: var(--primary-color); margin-bottom: 5px; font-size: 20px; }
        h3 { color: #666; margin-top: 0; font-size: 15px; margin-bottom: 25px; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 5px rgba(0,51,102,0.2); 
        }
        
        button { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            font-weight: bold; 
            transition: 0.3s; 
        }

        button:hover { background-color: var(--secondary-color); }
        button:disabled { background-color: #999; }

        .logout-btn {
            background-color: #dc3545;
            margin-top: 20px;
            font-size: 14px;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #status, #loginStatus { 
            margin-top: 20px; 
            font-weight: bold; 
            min-height: 20px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }

        #mainFormSection { display: none; }
    </style>
</head>
<body> 

<div class="container" id="loginSection">
    <div class="logo-container">
        <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" alt="Logo" class="dept-logo">
    </div>
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <h3>ለመቀጠል መጀመሪያ ይግቡ</h3>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus"></div>
</div> 

<div class="container" id="mainFormSection">
    <div class="logo-container">
        <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" alt="Logo" class="dept-logo">
    </div>
    <h2>የወንጀለኛ መረጃ መመዝገቢያ</h2>
    <hr style="opacity: 0.2; margin-bottom: 20px;">
    
    <form id="policeForm">
        <input type="text" name="fullname" placeholder="የወንጀለኛው ሙሉ ስም" required>
        
        <div style="display: flex; gap: 10px;">
            <input type="number" name="age" placeholder="እድሜ" style="flex: 1;" required>
            <select name="gender" style="flex: 1;" required>
                <option value="">ጾታ</option>
                <option value="ወንድ">ወንድ</option>
                <option value="ሴት">ሴት</option>
            </select>
        </div>

        <select name="crime" required>
            <option value="">የወንጀል አይነት ይምረጡ</option>
            <option value="ስርቆት">ስርቆት</option>
            <option value="ፀብ/አመፅ">ፀብ/አመፅ</option>
            <option value="ማጭበርበር">ማጭበርበር</option>
            <option value="ሌላ">ሌላ</option>
        </select>

        <input type="text" name="location" placeholder="የተያዘበት ቦታ (ወረዳ/ቀበሌ)" required>
        
        <textarea name="description" placeholder="የወንጀሉ ዝርዝር መግለጫ..." rows="3"></textarea>

        <button type="submit" id="submitBtn">መረጃውን መዝግብ</button>
    </form>
    
    <div id="status"></div>
    <button class="logout-btn" onclick="location.reload()">ውጣ</button>
</div> 

<script>
    // የእርስዎ አዲሱ Google Script URL ተተክቷል
    const scriptURL = 'https://script.google.com/macros/s/AKfycby4UmCt_NLOtJeCDi1CFE5bVSebRjEWBSN62YXj_rmsWiWadV28_zWizm6oTHoXFiEaQg/exec';
    
    const CORRECT_USERNAME = "silti_police"; 
    const CORRECT_PASSWORD = "Ye21334304";  

    // የመግቢያ ክፍል
    document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value; 

        if (u === CORRECT_USERNAME && p === CORRECT_PASSWORD) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainFormSection').style.display = "block";
        } else {
            const ls = document.getElementById('loginStatus');
            ls.className = "error";
            ls.innerText = "ስህተት! የተጠቃሚ ስም ወይም የይለፍ ቃል አልተዛመደም።";
        }
    }); 

    // መረጃ የመላኪያ ክፍል
    const form = document.getElementById('policeForm');
    const statusText = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn'); 

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if(!confirm("ይህንን መረጃ ለመመዝገብ እርግጠኛ ነዎት?")) return;

        submitBtn.disabled = true;
        statusText.className = "";
        statusText.innerText = "መረጃው እየተላከ ነው..."; 

        const formData = new FormData(form);

        fetch(scriptURL, { method: 'POST', body: formData})
            .then(response => {
                statusText.className = "success";
                statusText.innerText = "በተሳካ ሁኔታ ተመዝግቧል! ✅";
                submitBtn.disabled = false;
                form.reset(); 
            })
            .catch(error => {
                statusText.className = "error";
                statusText.innerText = "ስህተት አጋጥሟል! (ምናልባት በGoogle Script በኩል ጾታ እና መግለጫን እንዲቀበል አልተስተካከለ ይሆናል)።";
                submitBtn.disabled = false;
            });
    });
</script> 

</body>
</html>
