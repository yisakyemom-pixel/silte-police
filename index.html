<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሚቶ ወረዳ ፖሊስ | የሮንድ መረጃ ስርዓት</title>
    <style>
        :root { --primary-color: #003366; }
        body { font-family: 'Nyala', 'Arial', sans-serif; background-color: #eef2f7; margin: 0; padding: 20px; }
        .container { background: #fff; max-width: 500px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-top: 8px solid var(--primary-color); }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--primary-color); object-fit: cover; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 25px; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { background-color: var(--primary-color); color: #fff; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
        #mainFormSection { display: none; }
        .success { color: green; font-weight: bold; text-align: center; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="loginSection">
    <div class="logo-box">
        <img src="https://i.postimg.cc/SsRSXtTs/a4b729b8-5de3-4cfc-8bba-7d49a84f6c5b-removalai-preview.png" alt="Logo">
    </div>
    <h2>ሚቶ ወረዳ ፖሊስ ጽ/ቤት</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ወደ ስርዓቱ ግባ</button>
    </form>
    <div id="loginStatus" style="margin-top:10px;"></div>
</div>

<div class="container" id="mainFormSection">
    <h2>መንደር 4 የሮንድ ተረኞች</h2>
    <form id="patrolForm">
        <input type="text" name="team_names" placeholder="የ12ቱ ተረኞች ስም (በኮማ ለዩ)" required>
        <input type="date" name="date" required>
        <input type="tel" name="phone" placeholder="የቡድን መሪ ስልክ" required>
        <select name="status">
            <option>ሰላማዊ</option>
            <option>አጠራጣሪ እንቅስቃሴ</option>
            <option>ችግር የተፈታበት</option>
        </select>
        <textarea name="remarks" placeholder="ልዩ ማስታወሻዎች..." rows="4"></textarea>
        <button type="submit" id="submitBtn">መረጃውን አስመዝግብ</button>
    </form>
    <div id="status"></div>
    <button onclick="location.reload()" style="background:#cc0000; margin-top:15px; color:white;">ከስርዓቱ ውጣ</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbznOzQvBtmODMqJce50Pyq_OiciTxWHJOcjZOzXut7ScOC0NFqIzq22Jd2gYaDO6caXMg/exec';

    document.getElementById('loginForm').onsubmit = (e) => {
        e.preventDefault();
        // አዲሱ የተጠቃሚ ስም እና የይለፍ ቃል
        if(document.getElementById('username').value === "mito4" && document.getElementById('password').value === "2133") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainFormSection').style.display = "block";
        } else {
            document.getElementById('loginStatus').innerHTML = "<p class='error'>ስህተት! የተጠቃሚ ስም ወይም የይለፍ ቃል ተሳስቷል።</p>";
        }
    };

    document.getElementById('patrolForm').onsubmit = (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        fetch(scriptURL, { method: 'POST', body: new FormData(e.target)})
            .then(() => {
                document.getElementById('status').innerHTML = "<p class='success'>መረጃው ተመዝግቧል! ✅</p>";
                e.target.reset();
                btn.disabled = false;
            });
    };
</script>
</body>
</html>
