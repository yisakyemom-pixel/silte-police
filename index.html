<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ ቤት</title>
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>
        :root {
            --primary-color: #003366;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            direction: ltr; /* ለእንግሊዝኛ ፊደላት አጻጻፍ እንዲመች */
        }

        .container {
            background: white;
            width: 95%;
            max-width: 500px;
            margin: 10px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header-logo { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px; }
        
        .tabs { display: flex; margin-bottom: 20px; background: #eee; border-radius: 8px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; background: none; font-weight: bold; color: #555; }
        .tab-btn.active { background: var(--primary-color); color: white; }

        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; 
            font-size: 16px;
        }

        button.submit-btn { 
            background-color: var(--primary-color); color: white; 
            padding: 15px; border: none; border-radius: 8px; 
            cursor: pointer; width: 100%; font-weight: bold; font-size: 16px;
        }

        .page { display: none; }
        .page.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: var(--primary-color); color: white; }

        #video-container { 
            width: 100%; height: 400px; background: #000; 
            border-radius: 10px; margin-top: 10px; display: none; 
        }
    </style>
</head>
<body>

<div class="container" id="loginSection">
    <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" class="header-logo">
    <h2>የስልጤ ዞን ፖሊስ</h2>
    <input type="password" id="password" placeholder="የይለፍ ቃል ያስገቡ">
    <button class="submit-btn" onclick="checkLogin()">ግባ</button>
</div>

<div class="container" id="mainSection" style="display: none;">
    <div class="tabs">
        <button class="tab-btn active" id="btn1" onclick="showPage('registerPage', 'btn1')">መዝግብ</button>
        <button class="tab-btn" id="btn2" onclick="showPage('listPage', 'btn2'); fetchRecords();">ዝርዝር</button>
        <button class="tab-btn" id="btn3" onclick="showPage('videoPage', 'btn3')">ቪዲዮ ጥሪ</button>
    </div>

    <div id="registerPage" class="page active">
        <form id="crimeForm">
            <input type="text" name="fullname" placeholder="የወንጀለኛው ሙሉ ስም" required>
            <div style="display: flex; gap: 10px;">
                <input type="number" name="age" placeholder="እድሜ" style="flex: 1;" required>
                <select name="gender" style="flex: 1;" required>
                    <option value="">ጾታ</option>
                    <option value="ወንድ">ወንድ</option>
                    <option value="ሴት">ሴት</option>
                </select>
            </div>
            <input type="text" name="crime" placeholder="የወንጀል አይነት" required>
            <input type="text" name="location" placeholder="የተያዘበት ቦታ" required>
            <textarea name="description" placeholder="ዝርዝር መግለጫ (ካለ)..." rows="3"></textarea>
            <button type="submit" class="submit-btn">በመዝገብ ላይ አኑር</button>
        </form>
    </div>

    <div id="listPage" class="page">
        <h3>የተመዘገቡ ወንጀለኞች</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ስም</th>
                        <th>ወንጀል</th>
                        <th>ቦታ</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="videoPage" class="page">
        <h3>የቪዲዮ ኮንፈረንስ ማዕከል</h3>
        <p>ይህ ክፍል ለአዛዦችና ለመርማሪዎች የቀጥታ ግንኙነት የሚያገለግል ነው።</p>
        <button class="submit-btn" id="startVideoBtn" onclick="startMeeting()">የቪዲዮ ጥሪ ጀምር</button>
        <div id="video-container"></div>
    </div>
</div>

<script>
    // አንተ የላክኸው URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzCbj6WBXE_Sagr9gsJnpRfvEm94h7IHsVqliLCwmp0THqLkj5A6imjhleAAHs7OAKUSg/exec';

    // የመግቢያ ማረጋገጫ
    function checkLogin() {
        const pass = document.getElementById('password').value;
        if (pass === "Ye21334304") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainSection').style.display = "block";
        } else {
            alert("የይለፍ ቃል ስህተት ነው!");
        }
    }

    // ገጾችን መቀያየሪያ
    function showPage(pageId, btnId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById(btnId).classList.add('active');
    }

    // መረጃ መላኪያ (ወደ Google Sheet)
    document.getElementById('crimeForm').addEventListener('submit', e => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button');
        submitBtn.innerText = "በመመዝገብ ላይ...";
        submitBtn.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(e.target)})
        .then(response => {
            alert("መረጃው በትክክል ተመዝግቧል!");
            e.target.reset();
            submitBtn.innerText = "በመዝገብ ላይ አኑር";
            submitBtn.disabled = false;
        })
        .catch(error => {
            alert("ስህተት ተፈጥሯል!");
            submitBtn.disabled = false;
        });
    });

    // መረጃዎችን ከ Google Sheet ማምጫ
    async function fetchRecords() {
        const tableBody = document.getElementById('recordTableBody');
        tableBody.innerHTML = "<tr><td colspan='3'>በመጫን ላይ...</td></tr>";
        
        try {
            const response = await fetch(scriptURL + "?action=getRecords");
            const data = await response.json();
            tableBody.innerHTML = "";
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.fullname}</td><td>${row.crime}</td><td>${row.location}</td>`;
                tableBody.appendChild(tr);
            });
        } catch (e) {
            tableBody.innerHTML = "<tr><td colspan='3'>መረጃ ማግኘት አልተቻለም።</td></tr>";
        }
    }

    // የቪዲዮ ጥሪ መጀመሪያ
    function startMeeting() {
        document.getElementById('startVideoBtn').style.display = "none";
        document.getElementById('video-container').style.display = "block";
        
        const domain = 'meet.jit.si';
        const options = {
            roomName: 'Silti_Police_HQ_Meeting_Room',
            width: '100%',
            height: 400,
            parentNode: document.querySelector('#video-container'),
            userInfo: {
                displayName: 'Silti Police Officer'
            }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
    }
</script>

</body>
</html>
