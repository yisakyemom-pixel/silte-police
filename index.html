<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ</title>
    <style>
        body { font-family: Arial; background-color: #f4f4f4; text-align: center; }
        .form-container { 
            background: white; width: 80%; margin: 20px auto; 
            padding: 20px; border-radius: 10px; border-top: 5px solid #003366;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        button { background-color: #003366; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 95%; }
        .logo { width: 100px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <h3>የወንጀለኛ መረጃ መመዝገቢያ</h3>
    
    <form>
        <input type="text" placeholder="የወንጀለኛው ሙሉ ስም" required>
        <input type="number" placeholder="እድሜ">
        <select>
            <option>የወንጀል አይነት ይምረጡ</option>
            <option>ስርቆት</option>
            <option>ፀብ/አመፅ</option>
            <option>ማጭበርበር</option>
            <option>ሌላ</option>
        </select>
        <input type="text" placeholder="የተያዘበት ቦታ (ወረዳ/ቀበሌ)">
        <button type="button" onclick="alert('መረጃው ተመዝግቧል!')">መረጃውን መዝግብ</button>
    </form>
</div>

</body>
</html>
