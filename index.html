<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መንደር 4 የሮንድ መረጃ መመዝገቢያ</title>
    <style>
        :root { --primary-color: #2e7d32; --bg-color: #f1f8e9; } /* አረንጓዴ ለደህንነት */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); text-align: center; margin: 0; padding: 15px; }
        .container { background: white; width: 95%; max-width: 450px; margin: 10px auto; padding: 25px; border-radius: 15px; border-top: 10px solid var(--primary-color); box-shadow: 0px 10px 25px rgba(0,0,0,0.1); }
        .dept-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary-color); padding: 5px; margin-bottom: 15px; }
        h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { background-color: var(--primary-color); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        #status { margin-top: 20px; font-weight: bold; }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
        #mainFormSection { display: none; }
    </style>
</head>
<body>

<div class="container" id="loginSection">
    <img src="https://i.postimg.cc/SsRSXtTs/a4b729b8-5de3-4cfc-8bba-7d49a84f6c5b-removalai-preview.png" class="dept-logo">
    <h2>መንደር 4 የሮንድ መረጃ መግቢያ</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus" style="margin-top: 15px;"></div>
</div>

<div class="container" id="mainFormSection">
    <h2>የሮንድ እንቅስቃሴ መመዝገቢያ</h2>
    <form id="patrolForm">
        <input type="text" name="fullname" placeholder="የሮንድ አባል ስም" required>
        <input type="text" name="age" placeholder="የሮንድ ወቅት (ለምሳሌ፡ ሌሊት 2-6)" required>
        <select name="gender" required>
            <option value="">የአካባቢ ሁኔታ</option>
            <option value="ሰላማዊ">ሰላማዊ</option>
            <option value="አጠራጣሪ">አጠራጣሪ</option>
            <option value="ችግር ያለበት">ችግር ያለበት</option>
        </select>
        <input type="text" name="crime" placeholder="የተደረገ ክትትል/ስራ" required>
        <input type="text" name="location" placeholder="መንደር 4 የተሸፈነበት ቦታ" required>
        <textarea name="description" placeholder="ዝርዝር መግለጫና የተስተዋለ..." rows="3"></textarea>
        <button type="submit" id="submitBtn">መረጃውን ላክ</button>
    </form>
    <div id="status">
