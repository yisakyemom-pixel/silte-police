<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            background: white; 
            width: 95%; 
            max-width: 450px; 
            margin: 20px auto; 
            padding: 30px; 
            border-radius: 15px; 
            border-top: 10px solid #003366;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        } 

        /* የሎጎ ስታይል ማስተካከያ */
        .logo-container { 
            margin-bottom: 15px; 
        }
        .dept-logo { 
            width: 120px; 
            height: 120px; 
            object-fit: contain; /* አርማው ሳይቆራረጥ ሙሉ በሙሉ እንዲታይ */
            border-radius: 50%; 
            border: 3px solid #003366; 
            padding: 5px; 
            background-color: white;
        } 

        h2 { color: #003366; margin-bottom: 5px; font-size: 22px; }
        h3 { color: #666; margin-top: 0; font-weight: normal; font-size: 17px; margin-bottom: 25px; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none; 
        }
        input:focus, select:focus { 
            border-color: #003366; 
            box-shadow: 0 0 5px rgba(0,51,102,0.2); 
        }
        
        button { 
            background-color: #003366; 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            font-weight: bold; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        button:hover { 
            background-color: #002244; 
            transform: translateY(-2px); 
        }
        button:disabled { 
            background-color: #999; 
            cursor: not-allowed; 
        } 

        #status, #loginStatus { 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 15px; 
            min-height: 24px; 
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #003366; } 

        /* መጀመሪያ ፎርሙ እንዲደበቅ */
        #mainFormSection { display: none; }
    </style>
</head>
<body> 

<div class="container" id="loginSection">
    <div class="logo-container">
        <img src="https://i.ibb.co/6RTP0vF7/1779820211868.jpg" alt="Siltie Police Logo" class="dept-logo">
    </div>
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <h3>መረጃ ለመመዝገብ መጀመሪያ ይግቡ</h3>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus"></div>
</div> 

<div class="container" id="mainFormSection">
    <div class="logo-container">
        <img src="https://i.ibb.co/6RTP0vF7/1779820211868.jpg" alt="Siltie Police Logo" class="dept-logo">
    </div>
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <h3>የወንጀለኛ መረጃ መመዝገቢያ</h3>
    
    <form id="policeForm">
        <input type="text" name="fullname" placeholder="የወንጀለኛው ሙሉ ስም" required>
        <input type="number" name="age" placeholder="እድሜ" required>
        <select name="crime" required>
            <option value="">የወንጀል አይነት ይምረጡ</option>
            <option value="ስርቆት">ስርቆት</option>
            <option value="ፀብ/አመፅ">ፀብ/አመፅ</option>
            <option value="ማጭበርበር">ማጭበርበር</option>
            <option value="ሌላ">ሌላ</option>
        </select>
        <input type="text" name="location" placeholder="የተያዘበት ቦታ (ወረዳ/ቀበሌ)" required>
        <button type="submit" id="submitBtn">መረጃውን መዝግብ</button>
    </form>
    <div id="status"></div>
</div> 

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzaQVgxwZYMeAXTWgjHKLGyLYfSYK2nGW25uBzLtf3Zn1Tqjf8US41z7-IYLX86G3RJ/exec';
    
    // የሙከራ Login መረጃ
    const CORRECT_USERNAME = "admin"; 
    const CORRECT_PASSWORD = "123";  

    const loginForm = document.getElementById('loginForm');
    const loginSection = document.getElementById('loginSection');
    const mainFormSection = document.getElementById('mainFormSection');
    const loginStatus = document.getElementById('loginStatus'); 

    // የLogin ማረጋገጫ ተግባር
    loginForm.addEventListener('submit', e => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value; 

        if (u === CORRECT_USERNAME && p === CORRECT_PASSWORD) {
            loginStatus.className = "success";
            loginStatus.innerText = "በትክክል ገብተዋል...";
            setTimeout(() => {
                loginSection.style.display = "none";
                mainFormSection.style.display = "block";
            }, 800);
        } else {
            loginStatus.className = "error";
            loginStatus.innerText = "ስህተት! የተጠቃሚ ስም ወይም የይለፍ ቃል አልተዛመደም።";
        }
    }); 

    // ዳታ ወደ Google Sheets መላክ
    const form = document.getElementById('policeForm');
    const statusText = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn'); 

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusText.className = "loading";
        statusText.innerText = "መረጃው እየተላከ ነው..."; 

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                statusText.className = "success";
                statusText.innerText = "በተሳካ ሁኔታ ተመዝግቧል! ✅";
                submitBtn.disabled = false;
                form.reset(); 
            })
            .catch(error => {
                statusText.className = "error";
                statusText.innerText = "ችግር አጋጥሟል! እንደገና ይሞክሩ።";
                submitBtn.disabled = false;
            });
    });
</script> 

</body>
</html>
