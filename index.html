<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ - Dashboard</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #002244;
            --bg-color: #f0f2f5;
        } 

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 10px; 
            direction: rtl; 
            text-align: center;
        }
        
        .container { 
            background: white; 
            width: 95%; 
            max-width: 600px; 
            margin: 10px auto; 
            padding: 20px; 
            border-radius: 15px; 
            border-top: 10px solid var(--primary-color);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
            direction: ltr; 
        } 

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
            color: #666;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background-color: rgba(0, 51, 102, 0.05);
        }

        .dept-logo { 
            width: 70px; height: 70px; 
            border-radius: 50%; 
            border: 2px solid var(--primary-color); 
        } 

        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; 
        }
        
        button { 
            background-color: var(--primary-color); color: white; 
            padding: 12px; border: none; border-radius: 8px; 
            cursor: pointer; width: 100%; font-weight: bold; 
        } 

        .table-wrapper { overflow-x: auto; margin-top: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }

        th, td { padding: 10px; border: 1px solid #ddd; }

        th { background-color: var(--primary-color); color: white; }

        .page { display: none; }
        .page.active { display: block; }

        .logout-btn { background-color: #dc3545; font-size: 12px; width: auto; padding: 5px 15px; margin-top: 0; }
    </style>
</head>
<body> 

<div class="container" id="loginSection">
    <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" class="dept-logo">
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus" style="color: red; margin-top: 10px;"></div>
</div> 

<div class="container" id="mainFormSection" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" style="width: 40px;">
        <button class="logout-btn" onclick="location.reload()">ውጣ</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="t1" onclick="showPage('registerPage', 't1')">መረጃ መመዝገቢያ</button>
        <button class="tab-btn" id="t2" onclick="showPage('dashboardPage', 't2'); fetchRecords();">የተመዘገቡ ዝርዝር</button>
    </div>

    <div id="registerPage" class="page active">
        <form id="policeForm">
            <input type="text" name="fullname" placeholder="የወንጀለኛው ሙሉ ስም" required>
            <div style="display: flex; gap: 10px;">
                <input type="number" name="age" placeholder="እድሜ" style="flex: 1;" required>
                <select name="gender" style="flex: 1;" required>
                    <option value="">ጾታ</option>
                    <option value="ወንድ">ወንድ</option>
                    <option value="ሴት">ሴት</option>
                </select>
            </div> 
            <select name="crime" required>
                <option value="">የወንጀል አይነት</option>
                <option value="ስርቆት">ስርቆት</option>
                <option value="ፀብ/አመፅ">ፀብ/አመፅ</option>
                <option value="ማጭበርበር">ማጭበርበር</option>
                <option value="ሌላ">ሌላ</option>
            </select> 
            <input type="text" name="location" placeholder="የተያዘበት ቦታ" required>
            <textarea name="description" placeholder="ዝርዝር መግለጫ..."></textarea> 
            <button type="submit" id="submitBtn">መዝግብ</button>
        </form>
        <div id="status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div id="dashboardPage" class="page">
        <input type="text" id="searchInput" placeholder="በስም ፈልግ..." onkeyup="filterTable()" style="border: 2px solid var(--primary-color);">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ስም</th>
                        <th>ጾታ</th>
                        <th>ወንጀል</th>
                        <th>ቦታ</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="loader" style="display:none; margin-top:10px;">በመጫን ላይ...</div>
    </div>
</div> 

<script>
    // አዲሱ የ Script URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxXKuBLFSf55BMQ_pCQMUid2VCOm3NOt00bvsNQowAHmu0PkjqTK5agnQG9anZfj-XJbw/exec';
    
    // Login logic
    document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        if (document.getElementById('username').value === "silti_police" && 
            document.getElementById('password').value === "Ye21334304") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainFormSection').style.display = "block";
        } else {
            document.getElementById('loginStatus').innerText = "የተጠቃሚ ስም ወይም የይለፍ ቃል ስህተት ነው!";
        }
    });

    function showPage(p, t) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        document.getElementById(t).classList.add('active');
    }

    // መረጃ መመዝገቢያ (Submit)
    document.getElementById('policeForm').addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "በመመዝገብ ላይ...";
        status.innerText = "";

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', // CORS ችግርን ለመከላከል
            body: new FormData(e.target)
        })
        .then(() => { 
            alert("መረጃው በትክክል ተመዝግቧል!"); 
            status.innerText = "በተሳካ ሁኔታ ተመዝግቧል!";
            status.style.color = "green";
            e.target.reset(); 
            btn.disabled = false; 
            btn.innerText = "መዝግብ";
        })
        .catch(error => {
            console.error('Error!', error.message);
            status.innerText = "ስህተት ተከስቷል! እባክዎ እንደገና ይሞክሩ።";
            status.style.color = "red";
            btn.disabled = false;
            btn.innerText = "መዝግብ";
        });
    });

    // መረጃዎችን ማንበቢያ (Fetch)
    async function fetchRecords() {
        const body = document.getElementById('tableBody');
        const loader = document.getElementById('loader');
        body.innerHTML = ""; 
        loader.style.display = "block";

        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            loader.style.display = "none";
            
            if(data.length === 0) {
                body.innerHTML = "<tr><td colspan='4'>ምንም የተመዘገበ መረጃ የለም።</td></tr>";
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.fullname || '-'}</td>
                    <td>${row.gender || '-'}</td>
                    <td>${row.crime || '-'}</td>
                    <td>${row.location || '-'}</td>
                `;
                body.appendChild(tr);
            });
        } catch(e) { 
            loader.innerText = "መረጃውን መጫን አልተቻለም (Network Error)"; 
            console.error(e);
        }
    }

    // መፈለጊያ (Search)
    function filterTable() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.querySelectorAll("#tableBody tr");
        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(input) ? "" : "none";
        });
    }
</script>
</body>
</html>
