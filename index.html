<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስልጤ ዞን ፖሊስ መዝገብ - Smart System</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #002244;
            --bg-color: #f0f2f5;
            --danger-color: #dc3545;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            background: white; 
            width: 95%; 
            max-width: 450px; 
            margin: 20px auto; 
            padding: 30px; 
            border-radius: 15px; 
            border-top: 10px solid var(--primary-color);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        } 

        .dept-logo { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            border-radius: 50%; 
            border: 3px solid var(--primary-color); 
            padding: 5px; 
            margin-bottom: 15px;
        } 

        h2 { color: var(--primary-color); margin-bottom: 5px; font-size: 20px; }
        h3 { color: #666; margin-top: 0; font-size: 15px; margin-bottom: 25px; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            font-family: inherit;
        }
        
        button { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            font-weight: bold; 
        }

        button:disabled { background-color: #999; }

        .logout-btn {
            background-color: var(--danger-color);
            margin-top: 20px;
            font-size: 14px;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #status { 
            margin-top: 20px; 
            font-weight: bold; 
            padding: 10px;
            border-radius: 5px;
        }
        .success { color: #28a745; background: #e8f5e9; }
        .error { color: var(--danger-color); background: #ffebee; }
        .warning { color: #856404; background: #fff3cd; border: 1px solid #ffeeba; }

        #mainFormSection { display: none; }
    </style>
</head>
<body> 

<div class="container" id="loginSection">
    <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" alt="Logo" class="dept-logo">
    <h2>የስልጤ ዞን ፖሊስ መምሪያ</h2>
    <h3>ለመቀጠል መጀመሪያ ይግቡ</h3>
    <form id="loginForm">
        <input type="text" id="username" placeholder="የተጠቃሚ ስም" required>
        <input type="password" id="password" placeholder="የይለፍ ቃል" required>
        <button type="submit">ግባ</button>
    </form>
    <div id="loginStatus"></div>
</div> 

<div class="container" id="mainFormSection">
    <img src="https://i.postimg.cc/6qMpxWdq/1779820211868.jpg" alt="Logo" class="dept-logo">
    <h2>የወንጀለኛ መረጃ መመዝገቢያ</h2>
    <hr style="opacity: 0.2;">
    <form id="policeForm">
        <input type="text" name="fullname" placeholder="የወንጀለኛው ሙሉ ስም" required>
        <div style="display: flex; gap: 10px;">
            <input type="number" name="age" placeholder="እድሜ" style="flex: 1;" required>
            <select name="gender" style="flex: 1;" required>
                <option value="">ጾታ</option>
                <option value="ወንድ">ወንድ</option>
                <option value="ሴት">ሴት</option>
            </select>
        </div>
        <select name="crime" required>
            <option value="">የወንጀል አይነት ይምረጡ</option>
            <option value="ስርቆት">ስርቆት</option>
            <option value="ፀብ/አመፅ">ፀብ/አመፅ</option>
            <option value="ማጭበርበር">ማጭበርበር</option>
            <option value="ሌላ">ሌላ</option>
        </select>
        <input type="text" name="location" placeholder="የተያዘበት ቦታ (ወረዳ/ቀበሌ)" required>
        <textarea name="description" placeholder="የወንጀሉ ዝርዝር መግለጫ..." rows="3"></textarea>
        <button type="submit" id="submitBtn">መረጃውን መዝግብ</button>
    </form>
    <div id="status"></div>
    <button class="logout-btn" onclick="location.reload()">ውጣ</button>
</div> 

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyL2kDVBvrBncr6Zoz0JBkomvcgODF71jnpSwxvlbjtC7-MUeCVdcVSNe0sv6Zf-PHctw/exec';
    
    const CORRECT_USERNAME = "silti_police"; 
    const CORRECT_PASSWORD = "Ye21334304";  

    document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        if (document.getElementById('username').value === CORRECT_USERNAME && 
            document.getElementById('password').value === CORRECT_PASSWORD) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('mainFormSection').style.display = "block";
        } else {
            document.getElementById('loginStatus').innerText = "ስህተት! ይሞክሩ።";
            document.getElementById('loginStatus').style.color = "red";
        }
    }); 

    const form = document.getElementById('policeForm');
    const statusText = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn'); 

    form.addEventListener('submit', e => {
        e.preventDefault();
        if(!confirm("ለመመዝገብ እርግጠኛ ነዎት?")) return;

        submitBtn.disabled = true;
        statusText.className = "";
        statusText.innerText = "በመፈተሽ ላይ..."; 

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => response.text())
            .then(result => {
                if (result.trim() === "ALREADY_EXISTS") {
                    statusText.className = "warning";
                    statusText.innerText = "⚠️ ማስጠንቀቂያ፡ ይህ ግለሰብ ከዚህ በፊት ሪከርድ አለበት!";
                    alert("ማስጠንቀቂያ፡ ይህ ግለሰብ ቀድሞ ተመዝግቧል!");
                } else {
                    statusText.className = "success";
                    statusText.innerText = "በተሳካ ሁኔታ ተመዝግቧል! ✅";
                    form.reset(); 
                }
                submitBtn.disabled = false;
            })
            .catch(error => {
                statusText.className = "error";
                statusText.innerText = "ስህተት አጋጥሟል!";
                submitBtn.disabled = false;
            });
    });
</script> 
</body>
</html>
